<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - EVSU Hotel System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            max-width: 28rem;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 1.5rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #fee2e2;
            color: #991b1b;
            font-size: 0.8125rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            margin-bottom: 1rem;
        }
        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #dc2626;
            border-radius: 50%;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 0.9375rem;
            line-height: 1.5;
            color: #64748b;
            margin-bottom: 1.75rem;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.75rem 1.25rem;
            font-size: 0.9375rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #7B1113;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #5c0d0f;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="images/logo.png" alt="EVSU Logo" class="logo">
        <div>
            <span class="badge">
                <span class="badge-dot"></span>
                No Internet Connection
            </span>
        </div>
        <h1>You are currently offline</h1>
        <p>The EVSU Hotel System requires an active network connection. Please check your Wi-Fi or mobile data and try again.</p>
        <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
